{% extends "base.html" %}

{% block title %}Dashboard | VivaRepo{% endblock %}

{% block content %}
<section class="dashboard" aria-labelledby="dashboard-title">
    <header class="dashboard-heading">
        <h1 id="dashboard-title">VivaRepo Dashboard</h1>
        <p>
            A live view of how people engage with VivaRepo.
        </p>
    </header>

    <article class="metric-card" aria-label="Total registered VivaRepo accounts: {{ account_count }}">
        <div class="metric-chart" aria-hidden="true">
            {{ account_count_chart|safe }}
        </div>
        <noscript>
            <p class="metric-fallback">{{ account_count }}</p>
        </noscript>
    </article>
</section>
{% endblock %}
