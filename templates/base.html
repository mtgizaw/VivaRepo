{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VivaRepo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'projects:home' %}">VivaRepo</a>
        <nav aria-label="Main navigation">
            <a href="{% url 'projects:home' %}">Home</a>
            <a href="{% url 'projects:about' %}">About</a>
            <a href="{% url 'projects:trydemo' %}">Try Demo</a>
            {% if request.user.is_authenticated %}
                <span class="nav-user">{{ request.user.username }}</span>
                <form class="nav-form" method="post" action="{% url 'projects:logout' %}">
                    {% csrf_token %}
                    <button class="nav-button" type="submit">Log Out</button>
                </form>
            {% else %}
                <a href="{% url 'projects:login' %}">Log In</a>
                <a href="{% url 'projects:signup' %}">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
